name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install minification tools
        run: |
          npm install -g clean-css-cli terser

      - name: Minify CSS
        run: |
          cleancss -o assets/styles.min.css assets/styles.css
          echo "✓ CSS minified: $(wc -c < assets/styles.css) bytes → $(wc -c < assets/styles.min.css) bytes"

      - name: Minify JavaScript
        run: |
          terser assets/main.js -o assets/main.min.js --compress --mangle
          echo "✓ JS minified: $(wc -c < assets/main.js) bytes → $(wc -c < assets/main.min.js) bytes"

      - name: Update HTML to use minified assets
        run: |
          sed -i 's/styles\.css/styles.min.css/g' index.html
          sed -i 's/main\.js/main.min.js/g' index.html
          echo "✓ Updated index.html to use minified assets"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
