name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npx @tailwindcss/cli -i assets/tailwind.css -o assets/styles.min.css --minify

      - name: Minify JavaScript
        run: npx terser assets/main.js -o assets/main.min.js --compress --mangle

      - name: Update HTML to use minified assets
        run: |
          sed -i 's/styles\.css/styles.min.css/g' index.html
          sed -i 's/main\.js/main.min.js/g' index.html
          echo "✓ Updated index.html to use minified assets"

      - name: Clean build artifacts before upload
        run: |
          rm -rf node_modules package.json package-lock.json assets/tailwind.css
          echo "✓ Removed node_modules and source CSS from publish tree"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
